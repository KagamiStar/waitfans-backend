services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${WAITFANS_OSS_KEY_ID:-local-development}
      MINIO_ROOT_PASSWORD: ${WAITFANS_OSS_KEY_SECRET:-local-development}
    ports:
      - "${WAITFANS_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${WAITFANS_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - backend

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${WAITFANS_OSS_KEY_ID:-local-development}
      MINIO_ROOT_PASSWORD: ${WAITFANS_OSS_KEY_SECRET:-local-development}
      MINIO_BUCKET: ${WAITFANS_OSS_BUCKET:-waitfans-local}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        do sleep 2; done;
        mc mb --ignore-existing "local/$$MINIO_BUCKET";
        mc anonymous set download "local/$$MINIO_BUCKET";
    networks:
      - backend

  backend:
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      WAITFANS_STORAGE_PROVIDER: minio
      WAITFANS_OSS_BUCKET: ${WAITFANS_OSS_BUCKET:-waitfans-local}
      WAITFANS_OSS_BUCKET_URL: ${WAITFANS_OSS_BUCKET_URL:-http://127.0.0.1:9000/waitfans-local/}
      WAITFANS_OSS_ENDPOINT: http://minio:9000
      WAITFANS_OSS_KEY_ID: ${WAITFANS_OSS_KEY_ID:-local-development}
      WAITFANS_OSS_KEY_SECRET: ${WAITFANS_OSS_KEY_SECRET:-local-development}

volumes:
  minio-data:
